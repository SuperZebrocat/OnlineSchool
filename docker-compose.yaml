services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: app
    command: bash -c "python manage.py collectstatic --no-input && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    expose:
      - 8000
    tty: true
    volumes:
      -  .:/app
      - static_files:/app/static
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${NAME}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis
    container_name: redis
    command: bash -c "redis-server --save 20 i -- loglevel warning"
    volumes:
      - .data.cache:/data
    ports:
      - "6380:6379"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery
    env_file:
      - .env
    command: bash -c "celery -A config.celery_config worker -l INFO -P eventlet"
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beat
    env_file:
      - .env
    command: bash -c "celery -A config.celery_config beat -l INFO"
    depends_on:
      - app
      - postgres
      - redis


volumes:
  static_files:
  postgres_data:
  .data.cache:

