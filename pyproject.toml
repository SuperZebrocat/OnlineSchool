[tool.poetry]
name = "onlineschool"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.7"
djangorestframework = "^3.15.2"
psycopg2-binary = "^2.9.10"
python-dotenv = "^1.0.1"
pillow = "^11.1.0"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.0"
chardet = "^5.2.0"
coverage = "^7.7.1"
drf-yasg = "^1.21.10"
stripe = "^12.0.0"
forex-python = "^1.8"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.2"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untiped_defs = true
no_implicit_any = true
warn_return_any = true
exclude = "venv"
check_untyped_defs = true
warn_unreachable = true

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119



